<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="stylesheetparanaque.css" />
  <title>Orders - Parañaque</title>
</head>
<body>
  <div class="navbar">
    <img src="https://app.bploparanaque.com/safetyseal/images/logo.png" alt="City Seal" />
    <ul>
      <li><a href="file:///C:/Users/user/Downloads/iBarangay_Home.html">Home</a></li>
      <li><a href="file:///C:/Users/user/Downloads/iBarangay_Request.html">Request</a></li>
      <li><a class="active" href="#">Orders</a></li>
      <li><a href="#">Status</a></li>
      <li><a href="#">Contacts</a></li>
    </ul>
    <div class="profile-icon"></div>
  </div>

  <div class="orders-container">
    <div class="orders-title">Orders:</div>

    <div class="order-item">
      <div class="order-info">
        <img src="https://img.icons8.com/ios/50/document--v1.png" alt="doc" />
        <div class="order-name">Certificate of Residency</div>
      </div>
      <div class="order-price">₱50</div>
      <div class="quantity-control">
        <button onclick="adjustQty(this, -1)">-</button>
        <span>1</span>
        <button onclick="adjustQty(this, 1)">+</button>
      </div>
      <div class="order-total">₱50</div>
    </div>

    <div class="order-item">
      <div class="order-info">
        <img src="https://img.icons8.com/ios/50/document--v1.png" alt="doc" />
        <div class="order-name">Business Clearance</div>
      </div>
      <div class="order-price">₱50</div>
      <div class="quantity-control">
        <button onclick="adjustQty(this, -1)">-</button>
        <span>1</span>
        <button onclick="adjustQty(this, 1)">+</button>
      </div>
      <div class="order-total">₱50</div>
    </div>

    <div class="note">
      *Orders will be ready for pick-up in 3–5 business days
      <small>Bring any valid Government ID</small>
    </div>

    <div class="subtotal">SUBTOTAL: ₱100.00</div>

    <div class="actions">
      <button class="back-btn">Back</button>
      <button class="proceed-btn">Proceed</button>
    </div>
  </div>

  <script>
    function adjustQty(btn, delta) {
      const container = btn.closest('.quantity-control');
      const span = container.querySelector('span');
      const currentQty = parseInt(span.textContent);
      const newQty = Math.max(1, currentQty + delta);
      span.textContent = newQty;

      const item = container.closest('.order-item');
      const price = parseInt(item.querySelector('.order-price').textContent.replace('₱', ''));
      item.querySelector('.order-total').textContent = '₱' + (price * newQty);

      updateSubtotal();
    }

    function updateSubtotal() {
      let subtotal = 0;
      document.querySelectorAll('.order-item').forEach(item => {
        const total = parseInt(item.querySelector('.order-total').textContent.replace('₱', ''));
        subtotal += total;
      });
      document.querySelector('.subtotal').textContent = 'SUBTOTAL: ₱' + subtotal.toFixed(2);
    }
  </script>
</body>
</html>
